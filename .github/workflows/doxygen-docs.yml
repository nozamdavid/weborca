name: Generate Doxygen Documentation

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at midnight UTC
  workflow_dispatch:      # Manual trigger

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Only run on main branch of the main repository
    if: github.repository == 'OrcaSlicer/OrcaSlicer' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      # Doxygen with call graphs over all of src/ outgrows the runner's RAM;
      # replace the runner's swapfile with an 8 GB one.
      - name: Grow swap space
        run: |
          set -euo pipefail
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen and Graphviz
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: |
          set -euo pipefail
          # Override DOT_NUM_THREADS to avoid parallel dot race condition bug
          sed -i 's/^DOT_NUM_THREADS.*/DOT_NUM_THREADS = 1/' .doxygen
          doxygen .doxygen
          # Verify documentation was generated
          if [ ! -f "internal_docs/index.html" ]; then
            echo "Error: Documentation generation failed - index.html not found"
            exit 1
          fi
