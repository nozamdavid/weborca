<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OrcaSlicer WebAssembly Smoke Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background: #fafafa;
            color: #333;
        }
        #log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 5px;
            min-height: 250px;
            white-space: pre-wrap;
            font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #007acc;
            color: white;
        }
        button:disabled {
            background: #888;
            cursor: not-allowed;
        }
        .info {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>OrcaSlicer WebAssembly Smoke Test</h1>
    <div class="info">
        <p>crossOriginIsolated: <strong id="isolation-status">checking...</strong></p>
    </div>
    <button id="slice-btn">Slice</button>
    <h3>Log</h3>
    <pre id="log"></pre>

    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('isolation-status');
        const sliceBtn = document.getElementById('slice-btn');

        function appendLog(msg) {
            logEl.textContent += msg + '\n';
            console.log(msg);
        }

        const isIsolated = window.crossOriginIsolated;
        statusEl.textContent = String(isIsolated);
        appendLog(`crossOriginIsolated: ${isIsolated}`);

        let running = false;
        sliceBtn.addEventListener('click', () => {
            if (running) return;
            running = true;
            sliceBtn.disabled = true;
            appendLog('Starting slice worker...');

            const worker = new Worker('/wasm/web-smoke/worker.js');

            worker.onmessage = (e) => {
                const data = e.data;
                if (!data) return;

                if (data.type === 'log') {
                    appendLog(data.message);
                } else if (data.type === 'done') {
                    appendLog('--- SLICE RESULT ---');
                    appendLog(`crossOriginIsolated: ${data.crossOriginIsolated}`);
                    appendLog(`navigator.hardwareConcurrency: ${data.hardwareConcurrency}`);
                    appendLog(`Total slice time: ${data.totalTimeMs} ms`);
                    appendLog(`Layer count: ${data.layerCount}`);
                    appendLog(`G-code size: ${data.size} bytes`);
                    appendLog(`First 20 lines of G-code:\n${data.first20Lines}`);
                    appendLog('STATUS: SUCCESS');
                    running = false;
                    sliceBtn.disabled = false;
                } else if (data.type === 'error') {
                    appendLog(`ERROR: ${data.error}`);
                    appendLog('STATUS: ERROR');
                    running = false;
                    sliceBtn.disabled = false;
                }
            };

            worker.onerror = (err) => {
                appendLog(`Worker onerror: message="${err.message}" filename="${err.filename}" lineno=${err.lineno} colno=${err.colno} error="${err.error}"`);
                appendLog('STATUS: ERROR');
                running = false;
                sliceBtn.disabled = false;
            };

            worker.postMessage({ action: 'slice' });
        });
    </script>
</body>
</html>
