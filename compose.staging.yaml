name: weborca-staging
services:
  web:
    image: weborca-staging-web:latest
    build:
      context: .
      dockerfile: wasm/deploy/Dockerfile
      target: web
    restart: unless-stopped
    init: true
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      ORCA_HOST: ${ORCA_HOST:-weborca.noz.am}
    ports:
      - "${ORCA_BIND_ADDRESS:-0.0.0.0}:${ORCA_PORT:-8080}:8080"
